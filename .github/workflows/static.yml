# Deploy a tiny redirect site so github.io/anderfy forwards to the Vercel app.
# The real Anderfy app (with /api + Claude) runs on Vercel, not GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare redirect artifact
        run: |
          mkdir -p out
          cp github-pages/index.html out/index.html
          # Project Pages uses 404.html for unknown paths under /anderfy/*
          cp github-pages/index.html out/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
